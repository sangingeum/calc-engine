[project]
name = "calc-engine"
version = "0.1.0"
description = "Deterministic, subcommand-driven CLI math engine for AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "simpleeval>=0.9.13",
    "numpy>=1.26,<2",
    "numpy-financial>=1.0",
    "pint>=0.23",
    "sympy>=1.12",
    "scipy>=1.11",
]

[project.scripts]
calc = "calc.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
package = true

[build-system]
requires = ["uv_build>=0.7,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "calc"

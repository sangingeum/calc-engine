name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: pytest, ruff, mypy (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      # 3.12 is the typing target declared by [tool.mypy] python_version, and
      # the interpreter the locked dev environment resolves pint 0.26.1 for;
      # on 3.11 the lock resolves pint 0.25.3, which has no usable annotation
      # for pint.UnitRegistry and makes `mypy src` fail.
      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check src tests

      - name: Type check
        run: uv run mypy src

      - name: Test
        run: uv run pytest -q -W error
